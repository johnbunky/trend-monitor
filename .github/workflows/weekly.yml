name: Weekly Trend Summary

on:
  schedule:
    - cron: "0 9 * * 0"   # 09:00 UTC every Sunday
  workflow_dispatch:

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly summary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly.py

      - name: Commit report cleanup
        run: |
          git config user.name "trend-monitor-bot"
          git config user.email "bot@trend-monitor"
          git add reports/
          git diff --staged --quiet || git commit -m "cleanup: weekly reports $(date -u +%Y-%m-%d)"
          git push
